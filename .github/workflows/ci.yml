name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest -q

      # Every step must run from the recorded answers in fixtures/, with no API keys at all.
      - name: Replay every step (no API keys)
        env:
          TYPESAFE_API_KEY: ""
          GEMINI_API_KEY: ""
        run: |
          for step in steps/step*/; do
            echo "::group::$step"
            python "$step/run.py" --all --replay --json > /tmp/replay.json
            python -c "import json; d = json.load(open('/tmp/replay.json')); assert d['results'], 'no recordings'; assert not [r for r in d['results'] if 'error' in r], 'stale recordings'; print(len(d['results']), 'messages replayed')"
            echo "::endgroup::"
          done
